<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="awning" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a960ee"/>
      <stop offset="0.35" stop-color="#635bff"/>
      <stop offset="0.6" stop-color="#00d4ff"/>
      <stop offset="0.85" stop-color="#25d366"/>
      <stop offset="1" stop-color="#ffcb57"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#635bff"/>
      <stop offset="1" stop-color="#4a43d6"/>
    </linearGradient>
  </defs>
  <!-- fondo -->
  <rect width="512" height="512" rx="96" fill="#0a2540"/>
  <!-- techo del puesto: degradado firma de la marca -->
  <path d="M80 196 L432 196 L400 104 L112 104 Z" fill="url(#awning)"/>
  <rect x="80" y="196" width="352" height="36" rx="10" fill="url(#roof)"/>
  <!-- mostrador -->
  <rect x="112" y="258" width="288" height="148" rx="16" fill="#f6f9fc"/>
  <!-- ticket de rendición: esperado / contado / diferencia -->
  <rect x="140" y="280" width="232" height="26" rx="7" fill="#e6ebf1"/>
  <rect x="140" y="316" width="172" height="26" rx="7" fill="#e6ebf1"/>
  <rect x="140" y="352" width="198" height="30" rx="8" fill="#d8f5e3"/>
  <!-- tilde de rendición OK -->
  <path d="M306 366 l15 15 l33 -36" stroke="#0f6b3a" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- patas -->
  <rect x="136" y="406" width="18" height="42" rx="8" fill="#f6f9fc"/>
  <rect x="358" y="406" width="18" height="42" rx="8" fill="#f6f9fc"/>
</svg>
