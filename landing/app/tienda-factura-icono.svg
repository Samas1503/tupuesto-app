<?xml version="1.0" standalone="no"?>
<svg id="masterSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="220" height="220" class="drop-shadow-sm select-none" fill="none">
              <!-- Definitions / Clips / Gradients if needed -->
              <defs>
                <clipPath id="awningClip">
                  <path d="M 125,145 L 387,145 L 382,90 Q 256,76 130,90 Z"/>
