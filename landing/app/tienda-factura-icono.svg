              <!-- SHOP COUNTER / DESK -->
              <!-- Top Register / Small block on counter -->
              <rect x="272" y="222" width="50" height="24" rx="7" fill="#62C738" stroke="#2A323D" stroke-width="8" stroke-linejoin="round"/>
              <!-- Main Counter Body -->
              <rect x="230" y="246" width="130" height="66" rx="10" fill="#71D641" stroke="#2A323D" stroke-width="9" stroke-linejoin="round"/>
              <!-- Bottom shadow line on counter -->
              <path d="M 230,302 L 350,302" stroke="#5AB830" stroke-width="8" stroke-linecap="round"/>

              <!-- GROUND DETAIL LINES -->
              <line x1="258" y1="355" x2="318" y2="355" stroke="#2A323D" stroke-width="9" stroke-linecap="round"/>

              <!-- INVOICE / RECEIPT BILL CARD (Foreground Left) -->
              <!-- White card body with dark thick border -->
              <!-- Top cutout notch effect as present in original icon -->
              <g id="receiptCard">
                <path d="&#xA;                  M 148,242 &#xA;                  L 204,242 &#xA;                  C 204,242 208,252 216,252 &#xA;                  C 224,252 227,242 236,242 &#xA;                  L 236,400 &#xA;                  C 236,406 231,411 225,411 &#xA;                  L 148,411 &#xA;                  C 142,411 137,406 137,400 &#xA;                  L 137,253 &#xA;                  C 137,247 142,242 148,242 Z" fill="#FFFFFF" stroke="#2A323D" stroke-width="9" stroke-linejoin="round"/>

                <!-- Receipt Notch Accent line top -->
                <path d="M 221,242 L 235,242" stroke="#2A323D" stroke-width="9" stroke-linecap="round"/>

                <!-- Receipt item text line (Top) -->
                <line x1="162" y1="282" x2="210" y2="282" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>

                <!-- GREEN CHECKMARK (Verified / Visto Bueno) -->
                <path d="M 164,324 L 180,342 L 210,310" fill="none" stroke="#42A925" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Receipt Bottom details (Two dash lines) -->
                <line x1="162" y1="368" x2="175" y2="368" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>
                <line x1="189" y1="368" x2="211" y2="368" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>
                
                <line x1="162" y1="384" x2="175" y2="384" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>
                <line x1="189" y1="384" x2="204" y2="384" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>
              </g>
            </svg>