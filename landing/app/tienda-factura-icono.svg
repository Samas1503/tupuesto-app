              <path d="M 124,148 L 388,148 L 383,88 Q 256,74 129,88 Z" fill="#62C738"/>

              <!-- Stripes inside Awning (White/Light & Green) -->
              <g clip-path="url(#awningClip)">
                <!-- Stripe 1 (Green) L:125-162 -->
                <polygon points="120,70 162,70 162,150 120,150" fill="#62C738"/>
                <!-- Stripe 2 (White) L:162-200 -->
                <polygon points="162,70 200,70 200,150 162,150" fill="#EDF1F4"/>
                <!-- Stripe 3 (Green) L:200-237 -->
                <polygon points="200,70 237,70 237,150 200,150" fill="#62C738"/>
                <!-- Stripe 4 (White) L:237-275 -->
                <polygon points="237,70 275,70 275,150 237,150" fill="#EDF1F4"/>
                <!-- Stripe 5 (Green) L:275-312 -->
                <polygon points="275,70 312,70 312,150 275,150" fill="#62C738"/>
                <!-- Stripe 6 (White) L:312-350 -->
