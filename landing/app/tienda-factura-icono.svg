              <path d="&#xA;                M 122,142 &#xA;                C 122,142 120,172 138,172 &#xA;                C 156,172 156,145 174,145 &#xA;                C 192,145 192,172 210,172 &#xA;                C 228,172 228,145 246,145 &#xA;                C 264,145 264,172 282,172 &#xA;                C 300,172 300,145 318,145 &#xA;                C 336,145 336,172 354,172 &#xA;                C 372,172 372,145 390,145&#xA;                L 390,138 &#xA;                L 122,138 Z" fill="#2A323D"/>

              <!-- Scallop green & light fillings with outline stroke -->
              <path d="M 125,138 C 125,138 123,166 138,166 C 153,166 153,138 153,138 Z" fill="#62C738" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>
              <path d="M 153,138 C 153,138 153,166 174,166 C 195,166 195,138 195,138 Z" fill="#EDF1F4" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>
              <path d="M 195,138 C 195,138 195,166 216,166 C 237,166 237,138 237,138 Z" fill="#62C738" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>
              <path d="M 237,138 C 237,138 237,166 258,166 C 279,166 279,138 279,138 Z" fill="#EDF1F4" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>
              <path d="M 279,138 C 279,138 279,166 300,166 C 321,166 321,138 321,138 Z" fill="#62C738" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>
              <path d="M 321,138 C 321,138 321,166 342,166 C 363,166 363,138 363,138 Z" fill="#EDF1F4" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>
              <path d="M 363,138 C 363,138 363,166 381,166 C 396,166 388,138 388,138 Z" fill="#62C738" stroke="#2A323D" stroke-width="7" stroke-linejoin="round"/>

              <!-- Awning Top Outline Border -->
              <path d="M 125,142 L 129,88 Q 256,74 383,88 L 387,142" fill="none" stroke="#2A323D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- SUPPORT PILLARS / POLES -->
              <!-- Left pillar -->
              <line x1="172" y1="166" x2="172" y2="280" stroke="#2A323D" stroke-width="9" stroke-linecap="round"/>
              <!-- Right pillar -->
              <line x1="346" y1="166" x2="346" y2="340" stroke="#2A323D" stroke-width="9" stroke-linecap="round"/>

              <!-- RIGHT PILLAR FOOT / BASE -->
